<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connectly — Mini Social Media</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">Connectly</div><nav><button id="homeBtn">Home</button><button id="profileBtn">My Profile</button><button id="logoutBtn" class="hidden">Logout</button></nav></header><main><aside class="card intro"><h2>Mini Social Platform</h2><p>Connect with people, share posts, comment, like and follow.</p><div id="authBox"><div class="tabs"><button class="active" data-tab="login">Login</button><button data-tab="register">Register</button></div><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button class="primary">Login</button></form><form id="registerForm" class="hidden"><input id="regName" placeholder="Full name" required><input id="regEmail" type="email" placeholder="Email" required><input id="regPassword" type="password" placeholder="Password (6+ chars)" minlength="6" required><textarea id="regBio" placeholder="Short bio"></textarea><button class="primary">Create account</button></form><p id="authMsg" class="msg"></p></div><div id="userCard" class="hidden"></div></aside><section><div id="composer" class="card hidden"><h3>Create a post</h3><textarea id="postText" maxlength="500" placeholder="What's on your mind?"></textarea><input id="postImage" placeholder="Optional image URL"><button class="primary" id="postBtn">Post</button></div><div id="feed"></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
